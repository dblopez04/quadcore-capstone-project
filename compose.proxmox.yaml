services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OSRM_URL: http://osrm:5000
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend
    container_name: osrm
    volumes:
      - ./osrm-data:/data
    command: >
      sh -c "
      if [ ! -f /data/map.osrm ]; then
      osrm-extract -p /opt/foot.lua /data/map.osm &&
      osrm-partition /data/map.osrm &&
      osrm-customize /data/map.osrm;
      fi;
      osrm-routed --algorithm mld /data/map.osrm
      "
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_PROD:-}
    container_name: caddy
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  db-data:
