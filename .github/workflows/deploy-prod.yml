name: Deploy Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.image_names.outputs.backend_image }}
      caddy_image: ${{ steps.image_names.outputs.caddy_image }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image names
        id: image_names
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "caddy_image=ghcr.io/${owner}/${repo}-caddy" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.image_names.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.image_names.outputs.backend_image }}:prod-latest

      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.caddy
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: |
            ${{ steps.image_names.outputs.caddy_image }}:${{ github.sha }}
            ${{ steps.image_names.outputs.caddy_image }}:prod-latest

  deploy:
    name: Deploy to Proxmox
    runs-on: ubuntu-latest
    needs:
      - build_and_push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "compose.proxmox.yaml,compose.proxmox.images.yaml"
          target: ${{ secrets.PROD_APP_DIR }}
          overwrite: true

      - name: Pull and deploy containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ needs.build_and_push.outputs.backend_image }}
          CADDY_IMAGE: ${{ needs.build_and_push.outputs.caddy_image }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
          PROD_HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: PROD_APP_DIR,GHCR_USERNAME,GHCR_TOKEN,BACKEND_IMAGE,CADDY_IMAGE,IMAGE_TAG,PROD_HEALTHCHECK_URL
          script: |
            set -euo pipefail
            cd "$PROD_APP_DIR"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export BACKEND_IMAGE="${BACKEND_IMAGE}:${IMAGE_TAG}"
            export CADDY_IMAGE="${CADDY_IMAGE}:${IMAGE_TAG}"

            docker compose -f compose.proxmox.yaml -f compose.proxmox.images.yaml pull backend caddy
            docker compose -f compose.proxmox.yaml -f compose.proxmox.images.yaml up -d --no-build backend caddy cloudflared
            docker compose -f compose.proxmox.yaml -f compose.proxmox.images.yaml ps

            if [ -n "${PROD_HEALTHCHECK_URL:-}" ]; then
              curl --fail --silent --show-error "$PROD_HEALTHCHECK_URL" >/dev/null
            fi

            docker logout ghcr.io || true
