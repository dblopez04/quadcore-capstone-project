name: Build Prod Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-prod-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build and Push Images
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image names
        id: image_names
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "caddy_image=ghcr.io/${owner}/${repo}-caddy" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.image_names.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.image_names.outputs.backend_image }}:prod-latest

      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.caddy
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: |
            ${{ steps.image_names.outputs.caddy_image }}:${{ github.sha }}
            ${{ steps.image_names.outputs.caddy_image }}:prod-latest
